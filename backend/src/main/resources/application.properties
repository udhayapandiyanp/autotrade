# Server Port Configuration
server.port=${PORT:8081}

# Logging Level
logging.level.org.springframework.web=INFO

# Database Connection (Supabase Transaction Pooler)
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0}
spring.datasource.username=${SUPABASE_DB_USERNAME:postgres.bnfycnsebvokulwqennc}
spring.datasource.password=${SUPABASE_DB_PASSWORD:autotrade@2006}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Optimization (Prevents pool saturation on Supabase / Render)
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:1}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=20000

# JPA/Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
app.jwt.secret=${JWT_SECRET:yEb7ZdkG70pJB/t7piMQt+F5Az5gaShtFwHPFmKRk6yoAHCBbq6Gm0fue75AP9uqThPdeCu4kEwoMw/1W/wPyA==}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}